[package]
name = "totp-cli"
version = "0.1.0"
edition = "2024"
description = "Generate TOTP codes from secrets kept in the OS credential store"
license = "MIT"
repository = "https://github.com/CreativePlanningBusinessServices/totp-cli"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
directories = "6"
toml = "0.8"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"
url = "2"
percent-encoding = "2"
rpassword = "7"
zeroize = "1"
self_update = { version = "0.42", default-features = false, features = ["rustls", "archive-zip", "compression-zip-deflate"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
